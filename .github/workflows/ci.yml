name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: '⬇️ Checkout'
        uses: actions/checkout@v5

      - name: '☕ Setup Jdk 25'
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: '🛂 Setup Gradle'
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' && github.ref != 'refs/heads/dev' }}
          validate-wrappers: true

      - name: Use Node.js 25
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 25

      - name: '🔎 Determine version'
        if: ${{ github.event_name != 'pull_request' }}
        id: get-next-version
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            conventional-changelog-conventionalcommits
            semantic-release-export-data

      - name: '🏗️ Build, Test & Release'
        if: ${{ steps.get-next-version.outputs.new_release_published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: ${{ vars.DRY_RUN != 'false' }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            conventional-changelog-conventionalcommits
            semantic-release-export-data

      - name: '🧪 Run Dev Build'
        if: ${{ github.event_name == 'pull_request' || steps.get-next-version.outputs.new_release_published != 'true' }}
        run: ./gradlew build --stacktrace

      - name: '🕵️‍♂️ Collect jars'
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: |
            versions/*/build/libs/*.jar
