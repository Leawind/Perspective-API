name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - beta
          - alpha
          - release
        required: true
      dry_run:
        description: 'Dry run (build and plan only, publish nothing)'
        type: boolean
        default: true
      run_tests:
        description: 'Run unit tests'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: '⬇️ Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: '🦕 Setup Deno'
        uses: denoland/setup-deno@v2

      - name: '🧪 Check Deno scripts'
        run: |
          deno fmt --check
          deno lint
          deno test -A --parallel

      - name: '🔎 Plan release'
        id: release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: deno -A scripts/release/plan.ts

      - name: '🏷️ Apply release version'
        if: ${{ steps.release.outputs.release == 'true' }}
        run: deno -A scripts/release/apply-version.ts

      - name: '☕ Setup JDK 25'
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: '🛂 Setup Gradle'
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: '🧪 Unit tests'
        if: ${{ inputs.run_tests != false }}
        run: ./gradlew test

      - name: '🏗️ Build and test'
        run: ./gradlew buildAndCollect

      - name: '📦 Publish Modrinth and CurseForge'
        if: ${{ steps.release.outputs.release == 'true' }}
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || vars.DRY_RUN }}
          RELEASE_NOTES_FILE: build/release/notes.md
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew publishMods --stacktrace

      - name: '🚀 Publish GitHub release'
        if: >-
          ${{ steps.release.outputs.release == 'true' &&
              inputs.dry_run == false }}
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || vars.DRY_RUN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: deno -A scripts/release/publish-github.ts

      - name: '📤 Upload artifacts'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/*.jar
